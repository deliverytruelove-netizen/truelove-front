name: Deploy Next.js App

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Actualizado a v4 para evitar el aviso de Node 20

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # <--- Esto detiene el script si hay un error
            
            cd /usr/share/nginx/html/truelove-front

            echo "➡️ Haciendo git pull..."
            git checkout package-lock.json 2>/dev/null || true
            git pull

            echo "➡️ Instalando dependencias..."
            npm install

            echo "➡️ Generando build..."
            npm run build # <--- Primero el build

            echo "➡️ Reiniciando aplicación en PM2..."
            # Usamos 'restart' o 'reload' para no borrarla. 
            # Si no existe, la iniciamos.
            pm2 start npm --name "true-love" -- start || pm2 restart true-love

            echo "⬅️ Deploy completado con éxito."